<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ホームランチャレンジ</title>
<style>
  html,body{margin:0;height:100%;background:#0b1a10;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;outline:none}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720" tabindex="0"></canvas>
<script>
"use strict";
// =====================================================================
//  ホームランチャレンジ  (難易度3段階・簡単はストレートのみ)
//  Space / Enter / クリック / タップ = スイング
//  タイトルで 1・2・3 キー、またはボタンクリックで難易度選択
//  タイトルで Delete か Backspace を3秒おし続ける = 現在の難易度の記録を消す
// =====================================================================

const NL = String.fromCharCode(10);
const PITCHES_PER_GAME = 10;     // 1ゲームの球数(すべてストライク)
const FENCE_SIDE = 100;          // レフト・ライトのフェンスまでの距離(m)
const FENCE_CENTER = 120;        // センターのフェンスまでの距離(m)
const DIR_PEAK = 100;            // いちばん飛ぶ打球の向き(90が真ん中)
const SWING_TIME = 0.26;         // スイングの時間(秒)
const SWEET_SPOT = 2.7;          // バットの芯の位置
const OUT_X0 = 0.3;              // 外角補正の開始コース
const OUT_SPAN = 0.5;            // 外角補正の幅
const OUT_DIR_SHIFT = 35;        // 外角の角度シフト(度)
const OUT_SWEET_SHIFT = 0.75;    // 外角の芯シフト

// ---- 難易度設定 (球速・球種確率は全難易度で一定、飛びやすさだけ変化) ----
const DIFFICULTIES = {
  easy: {
    id: "easy",
    label: "簡単",
    sub: "目安 8本 / ストレートのみ",
    color: "#389e47",
    distMax: 132,       // かなりよく飛ぶ
    dirWidth: 46,       // 左右に多少ずれてもフェンスを越える
    sweetWidth: 1.40,   // 芯を外しても飛びやすい
    straightOnly: true  // ストレートのみ
  },
  normal: {
    id: "normal",
    label: "普通",
    sub: "目安 5本",
    color: "#2b78b8",
    distMax: 115,       // 標準の飛距離
    dirWidth: 32,       // 標準の方向許容幅
    sweetWidth: 0.95    // 標準の芯の広さ
  },
  hard: {
    id: "hard",
    label: "難しい",
    sub: "目安 2〜3本",
    color: "#c43b3b",
    distMax: 106,       // 飛距離が伸びにくい（芯と角度が揃わないと届かない）
    dirWidth: 23,       // 角度がシビア
    sweetWidth: 0.68    // 芯で完璧に捉えないと飛ばない
  }
};
const DIFF_KEYS = ["easy", "normal", "hard"];
let currentDiffKey = "normal";
const getDiff = () => DIFFICULTIES[currentDiffKey];

function fenceAt(angDeg){
  const a = Math.min(Math.max(angDeg, 45), 135);
  return FENCE_SIDE + (FENCE_CENTER - FENCE_SIDE) * Math.cos((a - 90) / 45 * Math.PI / 2);
}

// ---- 形 ----
const PIVOT = {x:-2.7, y:-4.0};
const BAT_LEN = 4.8, TH0 = -100, TH1 = 100, BALL_R = 0.28, BAT_R = 0.22;
const RINGS = [25,50,75,100];

const DEFS = [
  {name:"ストレート",     time:0.85, brk: 0.0, exp:3.0, prof:0, kmh:150, w:3.0, oppo:1},
  {name:"カーブ",         time:1.20, brk:-2.4, exp:3.0, prof:0, kmh:115, w:2.0},
  {name:"スライダー",     time:0.95, brk:-1.5, exp:3.5, prof:0, kmh:135, w:2.0},
  {name:"シュート",       time:0.95, brk: 1.4, exp:3.0, prof:0, kmh:138, w:1.5, oppo:1},
  {name:"チェンジアップ", time:1.35, brk: 0.0, exp:3.0, prof:0, kmh:108, w:2.0},
  {name:"フォーク",       time:1.00, brk: 0.0, exp:3.0, prof:1, kmh:130, w:1.5},
  {name:"ナックル",       time:1.10, brk: 0.0, exp:3.0, prof:2, kmh:100, w:1.0},
];

// ---- 画面 ----
const FONT = "'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP','Arial Black',Arial,sans-serif";
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const W = 1280, H = 720;
cv.focus();

// ---- 記録 ----
const mem = {};
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? (k in mem ? mem[k] : d) : v; } catch(e){ return k in mem ? mem[k] : d; } },
  set(k, v){ mem[k] = String(v); try { localStorage.setItem(k, String(v)); } catch(e){} },
  del(k){ delete mem[k]; try { localStorage.removeItem(k); } catch(e){} }
};

// ---- ゲームの状態 ----
let state = "title";
let timer = 0, pitchNo = 0, hr = 0, longest = 0;
let cur = null, kmh = 0, xt = 0, pitchT = 0, swingT = 0, swinging = false;
let hitDir = {x:0,y:1}, hitDist = 0, hitFence = FENCE_SIDE, flightT = 0, flightDur = 1, hitFair = false, hitHR = false;
let hitLabel = "", hitColor = "#fff", pitchInfo = "";
let msgBig = "", msgBigColor = "#fff", msgSmall = "";
let markers = [];
let bestHR = 0, bestDist = 0, games = 0, totalHR = 0;
let gameOverLock = 0, clearHold = 0, ballPosNow = {x:0,y:5.5}, batAngle = TH0, pitcherScale = 1.8;
let resultLines = [];
let pressed = false;
let pitchXc = 0;

const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.min(Math.max(v,a),b);
const clamp01 = v => clamp(v,0,1);
const f1 = v => v.toFixed(1);

// =====================================================================
//  入力とボタン定義
// =====================================================================
const held = {};
let paused = false;
const BTN_PAUSE  = {x:20,        y:652, w:210, h:48};
const BTN_RESUME = {x:W/2 - 310, y:420, w:290, h:96};
const BTN_HOME   = {x:W/2 + 20,  y:420, w:290, h:96};

// タイトル画面の難易度ボタン
const DIFF_BTNS = {
  easy:   {x: W/2 - 420, y: 425, w: 250, h: 105},
  normal: {x: W/2 - 125, y: 425, w: 250, h: 105},
  hard:   {x: W/2 + 170, y: 425, w: 250, h: 105}
};

function inGameState(){ return state === "windup" || state === "pitching" || state === "flying" || state === "resolved"; }
function openPause(){ if (inGameState() && !paused){ paused = true; pressed = false; } }
function resume(){ paused = false; pressed = false; }
function quitToHome(){ paused = false; pressed = false; markers = []; clearHold = 0; showTitle(); }
function inRect(p, r){ return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }

function toLogical(e){
  const r = cv.getBoundingClientRect();
  const k = Math.min(r.width / W, r.height / H);
  return { x: (e.clientX - r.left - (r.width  - W*k)/2) / k,
           y: (e.clientY - r.top  - (r.height - H*k)/2) / k };
}

function selectDifficulty(key){
  if (currentDiffKey !== key){
    currentDiffKey = key;
    loadBests();
    msgSmall = "";
  }
}

addEventListener("keydown", e => {
  if (["Space","Enter","Delete","Backspace","ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Escape"].includes(e.code)) e.preventDefault();
  if (!e.repeat && (e.code === "Space" || e.code === "Enter")) pressed = true;
  held[e.code] = true;
  if (e.repeat) return;

  if (state === "title"){
    if (e.code === "Digit1" || e.code === "Numpad1") selectDifficulty("easy");
    else if (e.code === "Digit2" || e.code === "Numpad2") selectDifficulty("normal");
    else if (e.code === "Digit3" || e.code === "Numpad3") selectDifficulty("hard");
    else if (e.code === "ArrowLeft"){
      const idx = (DIFF_KEYS.indexOf(currentDiffKey) + 2) % 3;
      selectDifficulty(DIFF_KEYS[idx]);
    } else if (e.code === "ArrowRight"){
      const idx = (DIFF_KEYS.indexOf(currentDiffKey) + 1) % 3;
      selectDifficulty(DIFF_KEYS[idx]);
    }
  }

  if (e.code === "Escape"){ if (paused) resume(); else openPause(); }
  else if (paused){
    if (e.code === "KeyH") quitToHome();
    else if (e.code === "Space" || e.code === "Enter") resume();
  }
});
addEventListener("keyup", e => { held[e.code] = false; });
addEventListener("blur", () => { for (const k in held) held[k] = false; openPause(); });

cv.addEventListener("pointerdown", e => {
  e.preventDefault(); cv.focus();
  const p = toLogical(e);
  if (paused){
    if (inRect(p, BTN_RESUME)) resume();
    else if (inRect(p, BTN_HOME)) quitToHome();
    return;
  }
  if (state === "title"){
    for (const key of DIFF_KEYS){
      if (inRect(p, DIFF_BTNS[key])){
        selectDifficulty(key);
        startGame();
        return;
      }
    }
  }
  if (inGameState() && inRect(p, BTN_PAUSE)){ openPause(); return; }
  pressed = true;
});
function press(){ const p = pressed; pressed = false; return p; }

// =====================================================================
//  ゲームの流れ (記録は難易度別に保存)
// =====================================================================
const keyPrefix = () => "bfc_" + currentDiffKey + "_";

function loadBests(){
  const p = keyPrefix();
  bestHR   = parseInt(store.get(p + "best_hr", 0)) || 0;
  bestDist = parseFloat(store.get(p + "best_dist", 0)) || 0;
  games    = parseInt(store.get(p + "games", 0)) || 0;
  totalHR  = parseInt(store.get(p + "total_hr", 0)) || 0;
}
function loadTop(){
  const raw = store.get(keyPrefix() + "top", "");
  const out = [];
  for (const item of String(raw).split(";")){
    if (!item) continue;
    const p = item.split(":");
    if (p.length < 3) continue;
    const h = parseInt(p[0]), d = parseFloat(p[1]);
    if (isNaN(h) || isNaN(d)) continue;
    out.push({hr:h, dist:d, date:p[2]});
  }
  return out;
}
function saveTop(list){
  store.set(keyPrefix() + "top", list.map(r => r.hr + ":" + r.dist.toFixed(1) + ":" + r.date).join(";"));
}

function showTitle(){
  loadBests();
  state = "title";
  msgBig = ""; msgSmall = "";
  batAngle = TH0; pitcherScale = 1.8;
  resultLines = [];
}

function startGame(){
  markers = [];
  pitchNo = 0; hr = 0; longest = 0;
  resultLines = [];
  beginWindup();
}

function beginWindup(){
  pitchNo++;
  cur = pickPitch();
  kmh = cur.kmh + rand(-4, 4);
  batAngle = TH0;
  swinging = false;
  msgBig = "";
  msgSmall = "構えて…";
  state = "windup";
  timer = rand(0.8, 1.3);
}

function pickPitch(){
  if (getDiff().straightOnly) return DEFS[0];
  let total = 0;
  for (const d of DEFS) total += d.w;
  let r = rand(0, total);
  for (const d of DEFS){ r -= d.w; if (r <= 0) return d; }
  return DEFS[0];
}

function releasePitch(){
  const pp = 0.86;
  const xc = rand(-0.3, 0.8);
  pitchXc = xc;
  xt = (xc - cur.brk * (pp - Math.pow(pp, cur.exp))) / pp;
  pitcherScale = 1.8;
  pitchT = 0; swinging = false; swingT = 0;
  msgSmall = "";
  state = "pitching";
  ballPosNow = ballPos(0);
}

function ballPos(t){
  const u = clamp(t / cur.time, 0, 1.3);
  let p = u;
  if (cur.prof === 1 && u <= 1) p = 1 - (1-u)*(1-u);
  let x;
  if (cur.prof === 2) x = xt*p + 0.5*Math.sin(6*Math.PI*p);
  else x = (xt + cur.brk)*p - cur.brk*Math.pow(p, cur.exp);
  return {x, y: 5.5 - 11*p};
}

function checkContact(b, thDeg){
  const th = thDeg * Math.PI/180;
  const dx = Math.cos(th), dy = Math.sin(th);
  const s = clamp((b.x-PIVOT.x)*dx + (b.y-PIVOT.y)*dy, 0.4, BAT_LEN);
  const cx = PIVOT.x + dx*s, cy = PIVOT.y + dy*s;
  const extra = s < 1.8 ? 0.06 : 0;
  const hit = Math.hypot(b.x-cx, b.y-cy) <= BALL_R + BAT_R + extra;
  return hit ? s : null;
}

function handlePitch(dt){
  if (press() && !swinging){ swinging = true; swingT = 0; }
  const omega = (TH1 - TH0) / SWING_TIME;
  const steps = Math.max(1, Math.ceil(dt / 0.004));
  const h = dt / steps;
  for (let i = 0; i < steps; i++){
    pitchT += h;
    const b = ballPos(pitchT);
    ballPosNow = b;
    let th = TH0;
    if (swinging){
      swingT += h;
      th = Math.min(TH0 + omega*swingT, TH1);
    }
    batAngle = th;
    if (swinging && swingT <= SWING_TIME + 0.05){
      const s = checkContact(b, th);
      if (s !== null){ onContact(th, s); return; }
    }
  }
  if (pitchT > cur.time*1.2 || (pitchT > cur.time && ballPosNow.y < -6)) resolveMiss();
}

function onContact(thDeg, s){
  const diff = getDiff();
  const phi = thDeg + 90 + rand(-2,2);
  const out = clamp01((pitchXc - OUT_X0) / OUT_SPAN) * (cur.oppo || 0);
  const sweet = SWEET_SPOT + OUT_SWEET_SHIFT * out;
  const peak  = DIR_PEAK  - OUT_DIR_SHIFT  * out;
  const qs = clamp01(1 - Math.pow((s - sweet)/diff.sweetWidth, 2));
  const qa = clamp01(1 - Math.pow((phi - peak)/diff.dirWidth, 2));
  const pf = clamp(0.92 + 0.18*(kmh - 110)/45, 0.9, 1.1);
  hitDist = (25 + diff.distMax*pf*Math.pow(qs,0.8)*Math.pow(qa,0.8)) * rand(0.97,1.03);
  hitFair = phi >= 45 && phi <= 135;
  hitFence = fenceAt(phi);
  hitHR = hitFair && hitDist >= hitFence;
  const rad = phi * Math.PI/180;
  hitDir = {x:Math.cos(rad), y:Math.sin(rad)};

  if (!hitFair){ hitLabel = "ファウル"; hitColor = "#ff7366"; }
  else if (hitHR){ hitLabel = "ホームラン!"; hitColor = "#ffe633"; }
  else if (hitDist >= hitFence - 10){ hitLabel = "おしい!"; hitColor = "#ffb34d"; }
  else if (hitDist >= 60){ hitLabel = "フライアウト"; hitColor = "#fff"; }
  else { hitLabel = "弱い当たり"; hitColor = "#fff"; }

  pitchInfo = cur.name + "  " + Math.round(kmh) + " km/h";
  flightT = 0;
  flightDur = 0.8 + hitDist/110;
  msgBig = ""; msgSmall = pitchInfo;
  state = "flying";
}

let flightPos = {x:0,y:0,height:0};
function handleFlight(dt){
  flightT += dt;
  const u = clamp01(flightT / flightDur);
  const e = 1 - (1-u)*(1-u);
  flightPos.x = hitDir.x * hitDist * e;
  flightPos.y = hitDir.y * hitDist * e;
  flightPos.height = Math.sin(Math.PI*u) * clamp01(hitDist/100);
  if (u >= 1) finishFlight();
}

function finishFlight(){
  if (hitHR) hr++;
  if (hitFair && hitDist > longest) longest = hitDist;
  markers.push({x:flightPos.x, y:flightPos.y, d: hitHR ? 4.5 : 3, color: hitColor});
  msgBig = hitLabel; msgBigColor = hitColor;
  msgSmall = pitchInfo + "   " + f1(hitDist) + " m";
  state = "resolved";
  timer = hitHR ? 2.4 : 1.8;
}

function resolveMiss(){
  msgBig = swinging ? "空振り" : "見逃し";
  msgBigColor = "#d9d9f2";
  msgSmall = cur.name + "  " + Math.round(kmh) + " km/h";
  state = "resolved";
  timer = 1.3;
}

function endGame(){
  state = "gameover";
  gameOverLock = 20;
  msgBig = ""; msgSmall = "";
  const newHR = hr > bestHR, newDist = longest > bestDist;
  if (newHR) bestHR = hr;
  if (newDist) bestDist = longest;
  games++; totalHR += hr;

  const top = loadTop();
  const d = new Date();
  const p2 = n => String(n).padStart(2,"0");
  const me = {hr, dist:longest, date: p2(d.getFullYear()%100) + "/" + p2(d.getMonth()+1) + "/" + p2(d.getDate())};
  top.push(me);
  top.sort((a,b) => b.hr - a.hr || b.dist - a.dist);
  if (top.length > 5) top.length = 5;
  const myRank = top.indexOf(me);

  const p = keyPrefix();
  store.set(p + "best_hr", bestHR);
  store.set(p + "best_dist", bestDist);
  store.set(p + "games", games);
  store.set(p + "total_hr", totalHR);
  saveTop(top);

  const L = [];
  L.push("結果  【" + getDiff().label + "】", "");
  L.push("ホームラン   " + hr + " / " + PITCHES_PER_GAME + " 本" + (newHR ? "    新記録!" : ""));
  L.push("最長飛距離   " + f1(longest) + " m" + (newDist ? "    新記録!" : ""), "");
  L.push("--- ベスト5 (" + getDiff().label + ") ---");
  top.forEach((r,i) => L.push((i+1) + "位   " + r.hr + " 本   " + f1(r.dist) + " m   " + r.date + (i === myRank ? "   ◀ 今回" : "")));
  L.push("", "スペースキーでホームへ戻る");
  resultLines = L;
}

function clearAllRecords(){
  const p = keyPrefix();
  ["best_hr","best_dist","games","total_hr","top"].forEach(k => store.del(p + k));
  loadBests();
  showTitle();
  msgSmall = "【" + getDiff().label + "】の記録を消しました";
}

function handleClear(){
  if (held.Delete || held.Backspace){
    clearHold += dtGlobal;
    const left = Math.ceil(3 - clearHold);
    msgSmall = "【" + getDiff().label + "】の記録を消しています…  " + Math.max(left,1) + "     (はなすと中止)";
    if (clearHold >= 3){ clearHold = 0; clearAllRecords(); }
  } else if (clearHold > 0){
    clearHold = 0; msgSmall = "";
  }
}

// =====================================================================
//  更新
// =====================================================================
let dtGlobal = 0;
function update(dt){
  dtGlobal = dt;
  switch (state){
    case "title":
      if (press()) startGame();
      handleClear();
      break;
    case "windup":
      timer -= dt;
      pitcherScale = 1.8 * (1 + 0.25*Math.abs(Math.sin(performance.now()/1000*7)));
      press();
      if (timer <= 0) releasePitch();
      break;
    case "pitching": handlePitch(dt); break;
    case "flying":   handleFlight(dt); press(); break;
    case "resolved":
      timer -= dt; press();
      if (timer <= 0){ if (pitchNo >= PITCHES_PER_GAME) endGame(); else beginWindup(); }
      break;
    case "gameover":
      if (gameOverLock > 0){ gameOverLock--; press(); break; }
      if (press()) showTitle();
      break;
  }
}

// =====================================================================
//  描画
// =====================================================================
const PS = H / 12.4;
const pX = x => W/2 + x*PS;
const pY = y => H/2 - (y - 0.2)*PS;
const FS = 4.5;
const fX = x => W/2 + x*FS;
const fY = y => H/2 - (y - 65)*FS;

function circle(cx, cy, d, color){
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(cx, cy, d/2, 0, Math.PI*2); ctx.fill();
}

function drawPitchView(){
  ctx.fillStyle = "#29732e"; ctx.fillRect(0,0,W,H);
  circle(pX(0), pY(-3.2), 13*PS, "#b88552");
  circle(pX(0), pY(5.5), 2.6*PS, "#cc9966");
  ctx.save(); ctx.translate(pX(0), pY(-4)); ctx.rotate(-Math.PI/4);
  ctx.fillStyle = "#fff"; ctx.fillRect(-0.6*PS, -0.6*PS, 1.2*PS, 1.2*PS); ctx.restore();
  ctx.fillStyle = "rgba(255,255,255,0.8)";
  const line = (x0,x1,y0,y1) => {
    const w = Math.max(Math.abs(x1-x0), 0.06), h = Math.max(Math.abs(y1-y0), 0.06);
    ctx.fillRect(pX((x0+x1)/2) - w*PS/2, pY((y0+y1)/2) - h*PS/2, w*PS, h*PS);
  };
  line(-2.3,-0.9,-5.6,-5.6); line(-2.3,-0.9,-2.4,-2.4); line(-2.3,-2.3,-5.6,-2.4); line(-0.9,-0.9,-5.6,-2.4);
  circle(pX(0), pY(5.5), pitcherScale*PS, "#263373");
  ctx.save(); ctx.translate(pX(PIVOT.x), pY(PIVOT.y)); ctx.rotate(-batAngle*Math.PI/180);
  ctx.fillStyle = "#8c5933"; ctx.fillRect(0, -0.1*PS, 1.8*PS, 0.2*PS);
  ctx.fillStyle = "#e6b366"; ctx.fillRect(1.8*PS, -0.25*PS, (BAT_LEN-1.8)*PS, 0.5*PS);
  ctx.fillStyle = "#73472a"; ctx.beginPath(); ctx.arc(0,0,0.2*PS,0,Math.PI*2); ctx.fill();
  ctx.restore();
  if (state === "pitching") circle(pX(ballPosNow.x), pY(ballPosNow.y), BALL_R*2*PS, "#fff");
}

function fieldColor(x, y){
  const r = Math.hypot(x, y);
  const ang = Math.atan2(y, x) * 180/Math.PI;
  const up = y > 0;
  const fair = up && ang >= 45 && ang <= 135;
  const dirt = [184,133,82];
  const FEN = fenceAt(ang);
  let c = [18,46,23];
  if (up && r < FEN + 12) c = [33,87,41];
  if (fair){
    if (r < FEN){
      const stripe = (Math.floor(r/6) % 2) === 0;
      const grass = stripe ? [69,158,69] : [61,145,64];
      c = grass;
      if (r > FEN - 7) c = [143,107,71];
      const dia = Math.abs(x) + Math.abs(y - 19.4);
      if (dia <= 25) c = dirt;
      if (dia <= 16) c = grass;
    } else c = [51,51,77];
    if (Math.abs(r - FEN) < 0.9) c = [20,31,102];
  }
  if (r < 5) c = dirt;
  if (up && r < FEN + 4){
    const d1 = Math.abs(y - x)*0.7071, d2 = Math.abs(y + x)*0.7071;
    if ((x > 0 && d1 < 0.35) || (x < 0 && d2 < 0.35)) c = [255,255,255];
  }
  if (fair) for (const rg of RINGS) if (Math.abs(r - rg) < 0.3 && r < FEN - 1.5) c = c.map(v => v + (255 - v)*0.45);
  return c;
}
const fieldCanvas = document.createElement("canvas");
(function buildField(){
  const FW = 520, FH = 320, res = 0.5;
  fieldCanvas.width = FW; fieldCanvas.height = FH;
  const fc = fieldCanvas.getContext("2d");
  const img = fc.createImageData(FW, FH);
  for (let j = 0; j < FH; j++) for (let i = 0; i < FW; i++){
    const wx = -130 + (i+0.5)*res, wy = -15 + (j+0.5)*res;
    const c = fieldColor(wx, wy);
    const o = ((FH-1-j)*FW + i)*4;
    img.data[o] = c[0]; img.data[o+1] = c[1]; img.data[o+2] = c[2]; img.data[o+3] = 255;
  }
  fc.putImageData(img, 0, 0);
})();

function drawFieldView(){
  ctx.fillStyle = "#0d2414"; ctx.fillRect(0,0,W,H);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(fieldCanvas, fX(-130), fY(145), 260*FS, 160*FS);
  ctx.fillStyle = "rgba(255,255,255,0.75)"; ctx.font = "bold 18px Arial"; ctx.textAlign = "center";
  for (const rg of RINGS) ctx.fillText(rg + "m", fX(0), fY(rg) - 6);
  ctx.fillStyle = "#cfd3ff"; ctx.font = "bold 22px " + FONT;
  const lab = (deg, str) => {
    const rad = deg*Math.PI/180, rr = fenceAt(deg) + 9;
    ctx.fillText(str, fX(Math.cos(rad)*rr), fY(Math.sin(rad)*rr));
  };
  lab(56, "ライト " + FENCE_SIDE + "m"); lab(90, "センター " + FENCE_CENTER + "m"); lab(124, "レフト " + FENCE_SIDE + "m");
  for (const m of markers) circle(fX(m.x), fY(m.y), m.d*FS, m.color);
  if (state === "flying"){
    circle(fX(flightPos.x), fY(flightPos.y), 2.2*FS, "rgba(0,0,0,0.4)");
    circle(fX(flightPos.x), fY(flightPos.y + flightPos.height*6), 2.2*FS*(1 + 1.2*flightPos.height), "#fff");
  }
}

function text(str, x, y, size, color, align, baseline){
  ctx.font = "bold " + size + "px " + FONT;
  ctx.textAlign = align || "center";
  ctx.textBaseline = baseline || "middle";
  const lines = String(str).split(NL);
  const lh = size*1.3;
  const top = (baseline === "top") ? y : (baseline === "bottom") ? y - lh*lines.length : y - lh*(lines.length-1)/2;
  lines.forEach((ln, i) => {
    const yy = top + i*lh;
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillText(ln, x+2, yy+2);
    ctx.fillStyle = color; ctx.fillText(ln, x, yy);
  });
}

function drawDifficultyButtons(){
  DIFF_KEYS.forEach((key, idx) => {
    const d = DIFFICULTIES[key];
    const r = DIFF_BTNS[key];
    const selected = (key === currentDiffKey);

    ctx.fillStyle = selected ? d.color : "rgba(35, 45, 40, 0.85)";
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(r.x, r.y, r.w, r.h, 16) : ctx.rect(r.x, r.y, r.w, r.h);
    ctx.fill();

    if (selected){
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#ffe633";
      ctx.stroke();
    }

    text((idx + 1) + ". " + d.label, r.x + r.w/2, r.y + 38, 36, "#fff");
    text(d.sub, r.x + r.w/2, r.y + 80, 20, selected ? "#ffe633" : "#ccc");
  });
}

function drawHud(){
  const inGame = state !== "title" && state !== "gameover";
  if (inGame || state === "gameover"){
    text(Math.min(pitchNo, PITCHES_PER_GAME) + " / " + PITCHES_PER_GAME + " 球目  【" + getDiff().label + "】", 27, 20, 31, "#fff", "left", "top");
    text("ホームラン  " + hr, W/2, 12, 50, "#ffe633", "center", "top");
    text("最長  " + f1(longest) + " m" + NL + "ベスト  " + bestHR + " 本 / " + f1(bestDist) + " m", W-27, 20, 27, "#fff", "right", "top");
  }
  if (msgBig) text(msgBig, W/2, 280, 80, msgBigColor);
  if (msgSmall) text(msgSmall, W/2, H-50, 37, "#fff", "center", "middle");

  if (state === "title"){
    ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(0,0,W,H);
    text("ホームランチャレンジ", W/2, 105, 70, "#ffe633");
    text("【" + getDiff().label + "】  最多 " + bestHR + " 本  /  最長 " + f1(bestDist) + " m" + NL + "プレイ回数  " + games + " 回    通算  " + totalHR + " 本",
         W/2, 240, 34, "#fff");
    text("難易度を選んでスタート（クリック または 1・2・3 / ←→キー）", W/2, 370, 28, "#d4f7dc");
    drawDifficultyButtons();
    const a = 0.55 + 0.45*Math.sin(performance.now()/1000*4);
    text("スペースキーで【" + getDiff().label + "】スタート", W/2, 575, 40, "rgba(255,255,255," + a.toFixed(2) + ")");
    text("(スイング: スペース / クリック / タップ   Deleteキー3秒長押し: 記録消去)", W/2, 635, 22, "#bbb");
  }
  if (state === "gameover"){
    ctx.fillStyle = "rgba(0,0,0,0.65)"; ctx.fillRect(0,0,W,H);
    text(resultLines.join(NL), W/2, H/2, 36, "#fff");
  }
}

function draw(){
  if (state === "flying" || (state === "resolved" && hitLabel && lastWasHit)) drawFieldView();
  else drawPitchView();
  drawHud();
}
let lastWasHit = false;

// =====================================================================
//  メインループ
// =====================================================================
let last = performance.now();
function frame(now){
  let dt = (now - last)/1000; last = now;
  if (dt > 0.1) dt = 0.1;
  const prev = state;
  if (!paused){
    update(dt);
    if (state === "flying") lastWasHit = true;
    if (state === "windup" || state === "title" || state === "gameover") lastWasHit = false;
    if (state === "resolved" && prev === "pitching") lastWasHit = false;
  }
  draw();
  drawPauseUi();
  requestAnimationFrame(frame);
}

function button(r, label, color){
  ctx.fillStyle = color; ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(r.x, r.y, r.w, r.h, 14) : ctx.rect(r.x, r.y, r.w, r.h);
  ctx.fill();
  text(label, r.x + r.w/2, r.y + r.h/2, 32, "#fff");
}
function drawPauseUi(){
  if (paused){
    ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(0, 0, W, H);
    text("中断中", W/2, 250, 76, "#ffe633");
    text("つづけますか? ホームへ戻りますか?", W/2, 340, 36, "#fff");
    button(BTN_RESUME, "つづける (Space)", "#2f7d3a");
    button(BTN_HOME, "ホームへ (H)", "#a8332d");
    text("この回の記録は、保存されません", W/2, 570, 28, "#ddd");
  } else if (inGameState()){
    ctx.globalAlpha = 0.75;
    button(BTN_PAUSE, "中断 (Esc)", "#333a44");
    ctx.globalAlpha = 1;
  }
}

loadBests();
showTitle();
requestAnimationFrame(frame);

window.__bfc = { get paused(){return paused;}, get swinging(){return swinging;}, get games(){return games;}, get state(){return state;}, get pitchT(){return pitchT;}, get cur(){return cur;}, get hr(){return hr;}, get longest(){return longest;}, get pitchXc(){return pitchXc;},
                 get hitDist(){return hitDist;}, ballPos: t => ballPos(t) };
</script>
